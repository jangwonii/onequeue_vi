<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출고 데스크 · Dispatch</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><a class="brand" href="/">D<span>출고 데스크<small>DISPATCH / LOCAL WORKSPACE</small></span></a><div class="tools"><button id="refresh">새로고침</button><a class="button" id="export" href="/api/export" download>백업 다운로드</a><label class="button">백업 복구<input id="restore" type="file" accept="application/json,.json"></label></div></header>
<main><div class="intro"><div><p class="eyebrow">작은 창고의 모든 흐름</p><h1>주문에서 출고까지,<br>한 작업대에서.</h1></div><p>재고를 확인하고 주문을 예약하세요.<br>출고 시점에 실제 재고가 차감됩니다.</p></div>
<div id="notice" role="status" aria-live="polite">데이터를 불러오는 중입니다.</div><section class="metrics" aria-label="운영 현황"><div>등록 품목<strong id="product-count">0</strong></div><div>출고 대기<strong id="pending-count">0</strong></div><div>출고 완료<strong id="shipped-count">0</strong></div></section>
<div class="workspace"><section class="inventory"><div class="section-title"><h2>01 <span>재고 장부</span></h2></div><form id="product-form"><label>SKU<input name="sku" required maxlength="100" placeholder="예: CUP-01"></label><label>상품명<input name="name" required maxlength="100" placeholder="상품 이름"></label><label>초기 수량<input name="stock" type="number" min="0" max="1000000" step="1" value="0" required></label><button class="primary">상품 등록</button></form><label class="search-label">재고 검색<input id="search" type="search" placeholder="SKU 또는 상품명 검색"></label><div id="inventory"></div><form id="restock-form"><h3>재고 입고</h3><label>상품<select name="sku" id="restock-sku" required></select></label><label>입고 수량<input name="qty" type="number" min="1" max="1000000" step="1" value="1" required></label><button>입고 반영</button></form></section>
<section class="orders"><h2>02 <span>주문 작업대</span></h2><form id="order-form"><label>고객 / 주문명<input name="customer" maxlength="100" required placeholder="예: 성수 쇼룸 10월 주문"></label><div id="lines"></div><button type="button" id="add-line">+ 품목 추가</button><button class="primary">주문 예약</button></form><div class="section-title"><h3>주문 이력</h3><label>상태<select id="filter"><option value="all">전체</option><option value="reserved">출고 대기</option><option value="shipped">출고 완료</option><option value="cancelled">취소</option></select></label></div><div id="orders"></div></section></div><footer>로컬 운영자용 파일럿 · 데이터는 이 컴퓨터에 저장됩니다.</footer></main><script type="module" src="/app.js"></script></body></html>
